[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pairspec"
version = "0.1.0"
description = "Blind combinatorial QA engine (Pairwise IPOG + BVA + Spec Drift + MCP) — derive test oracles from specs only to eliminate the AI Mirror Trap."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Sebastien (Beusseb)" }
]
keywords = ["qa", "testing", "pairwise", "ipog", "bva", "spec-driven", "mcp", "ai-agents", "combinatorial-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/Beusseb/pairspec"
Repository = "https://github.com/Beusseb/pairspec"
Issues = "https://github.com/Beusseb/pairspec/issues"

[project.scripts]
pairspec = "pairspec.cli:main"
pairspec-mcp = "pairspec.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pairspec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true



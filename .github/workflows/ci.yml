name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint (Ruff) & Typecheck (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Ruff check
        run: uvx ruff check .
      - name: Mypy check
        run: uvx mypy src/pairspec

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: uv venv --python ${{ matrix.python-version }} && uv pip install -e ".[dev]"
      - name: Run pytest suite
        run: uv run pytest -v
      - name: Run Mirror Trap benchmark demo
        run: uv run python examples/fintech_payout/mirror_trap_demo.py
      - name: CLI end-to-end smoke test (generate -> emit -> drift)
        run: |
          TMP_DIR=$(mktemp -d)
          uv run pairspec generate examples/fintech_payout/spec.toml --lock "$TMP_DIR/pairspec.lock.json"
          uv run pairspec emit examples/fintech_payout/spec.toml --format pytest --out "$TMP_DIR/test_payout.py"
          uv run pairspec drift examples/fintech_payout/spec.toml --tests "$TMP_DIR" --lock "$TMP_DIR/pairspec.lock.json"
